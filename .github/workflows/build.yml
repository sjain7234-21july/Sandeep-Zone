name: Build Sandeep Zone APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Create project files
    shell: bash
    run: |
      mkdir -p app/src/main/java/com/sandeep/zone

      cat > settings.gradle.kts <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "SandeepZone"
      include(":app")
      EOF

      cat > build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application") version "8.7.3" apply false
          id("org.jetbrains.kotlin.android") version "2.0.21" apply false
      }
      EOF
      
