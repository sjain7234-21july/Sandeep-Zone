
name: Build Sandeep Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sandeep/zone

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SandeepZone"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.sandeep.zone"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sandeep.zone"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Sandeep Zone"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sandeep/zone/MainActivity.kt <<'EOF'
          package com.sandeep.zone

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.speech.tts.TextToSpeech
          import android.text.Editable
          import android.text.TextWatcher
          import java.util.Locale

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ready = false
              private lateinit var root: LinearLayout
              private val navy = Color.rgb(12, 22, 48)
              private val white = Color.WHITE
              private val blue = Color.rgb(65, 115, 230)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
                  showHome()
              }

              private fun baseLayout(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 24, 20, 24)
                      setBackgroundColor(navy)
                  }
              }

              private fun text(
                  value: String,
                  size: Float,
                  color: Int = white
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      setPadding(0, 10, 0, 10)
                  }
              }

              private fun button(
                  label: String,
                  action: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = label
                      setOnClickListener { action() }
                  }
              }

              private fun showHome() {
                  root = baseLayout()
                  root.gravity = Gravity.CENTER

                  val title = text("Welcome to Sandeep Zone", 27f)
                  title.gravity = Gravity.CENTER

                  val subtitle = text(
                      "Your personal assistant and recruitment hub",
                      15f
                  )
                  subtitle.gravity = Gravity.CENTER

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(button("Test Greeting") { greet() })
                  root.addView(button("Candidate List") { showCandidates() })

                  setContentView(root)
              }

              private fun showCandidates() {
                  root = baseLayout()

                  root.addView(text("Candidate List", 27f))
                  root.addView(text(
                      "MarutiNandan Manpower Business Solution",
                      14f
                  ))

                  root.addView(button("Home") { showHome() })

                  val search = EditText(this).apply {
                      hint = "Search name, mobile, email or process"
                      textSize = 16f
                      setSingleLine(true)
                      setPadding(12, 12, 12, 12)
                      setBackgroundColor(white)
                      setTextColor(Color.BLACK)
                      setHintTextColor(Color.DKGRAY)
                  }
                  root.addView(search)

                  val result = text(
                      "Candidate database connection is being prepared.",
                      16f
                  )
                  root.addView(result)

                  val note = text(
                      "Live records will appear after secure Google Sheet access is configured. No sample candidates are shown.",
                      13f
                  )
                  root.addView(note)

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(
                          s: CharSequence?, start: Int,
                          count: Int, after: Int
                      ) {}

                      override fun onTextChanged(
                          s: CharSequence?, start: Int,
                          before: Int, count: Int
                      ) {
                          result.text = if (s.isNullOrBlank()) {
                              "Candidate database connection is being prepared."
                          } else {
                              "Search will work when the live candidate database is connected."
                          }
                      }

                      override fun afterTextChanged(s: Editable?) {}
                  })

                  setContentView(ScrollView(this).apply {
                      addView(root)
                  })
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale.US)
                      ready = result != TextToSpeech.LANG_MISSING_DATA &&
                          result != TextToSpeech.LANG_NOT_SUPPORTED
                  }
              }

              private fun greet() {
                  if (ready) {
                      tts?.speak(
                          "Welcome to Sandeep Zone",
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "welcome"
                      )
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SandeepZone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
